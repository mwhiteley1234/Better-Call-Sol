<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 120" width="420" height="120">
  <!-- Option 3: Stacked bold type with teal sun/sol icon -->
  <defs>
    <linearGradient id="g3" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#36D0DB"/>
      <stop offset="100%" stop-color="#1A9EA8"/>
    </linearGradient>
  </defs>
  <!-- Sun/Sol icon — rays around a circle -->
  <circle cx="50" cy="60" r="18" fill="url(#g3)"/>
  <!-- Rays -->
  <line x1="50" y1="32" x2="50" y2="24" stroke="#26C0CB" stroke-width="3" stroke-linecap="round"/>
  <line x1="50" y1="96" x2="50" y2="88" stroke="#26C0CB" stroke-width="3" stroke-linecap="round"/>
  <line x1="22" y1="60" x2="14" y2="60" stroke="#26C0CB" stroke-width="3" stroke-linecap="round"/>
  <line x1="78" y1="60" x2="86" y2="60" stroke="#26C0CB" stroke-width="3" stroke-linecap="round"/>
  <line x1="30.2" y1="40.2" x2="24.5" y2="34.5" stroke="#26C0CB" stroke-width="3" stroke-linecap="round"/>
  <line x1="69.8" y1="79.8" x2="75.5" y2="85.5" stroke="#26C0CB" stroke-width="3" stroke-linecap="round"/>
  <line x1="30.2" y1="79.8" x2="24.5" y2="85.5" stroke="#26C0CB" stroke-width="3" stroke-linecap="round"/>
  <line x1="69.8" y1="40.2" x2="75.5" y2="34.5" stroke="#26C0CB" stroke-width="3" stroke-linecap="round"/>
  <!-- Inner arrow pointing up (conversion) -->
  <path d="M42 66 L50 50 L58 66" fill="none" stroke="#080C14" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="50" y1="50" x2="50" y2="70" stroke="#080C14" stroke-width="3" stroke-linecap="round"/>
  <!-- Text layout -->
  <text x="108" y="42" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="11" font-weight="700" fill="#465870" letter-spacing="4">BETTER CALL</text>
  <!-- Big CRO SOL -->
  <text x="108" y="86" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="46" font-weight="800" fill="#EEE9E2" letter-spacing="-2">CRO</text>
  <text x="252" y="86" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="46" font-weight="800" fill="#26C0CB" letter-spacing="-2">SOL</text>
  <!-- Subtle tagline -->
  <text x="108" y="105" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="9" font-weight="500" fill="#465870" letter-spacing="2.5">CONVERSION RATE OPTIMIZATION</text>
