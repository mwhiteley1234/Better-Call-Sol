<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <!-- Option 1: Bold Monogram Shield — "CRO SOL" in a shield/badge shape -->
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#26C0CB"/>
      <stop offset="100%" stop-color="#1A9EA8"/>
    </linearGradient>
  </defs>
  <!-- Shield mark -->
  <path d="M10 20 L10 75 Q10 100 35 110 L50 115 L65 110 Q90 100 90 75 L90 20 Q90 10 80 10 L20 10 Q10 10 10 20Z" fill="url(#g1)"/>
  <!-- "CS" monogram inside shield -->
  <text x="50" y="58" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="32" font-weight="800" fill="#080C14" letter-spacing="-1">CS</text>
  <!-- Conversion arrow inside shield -->
  <path d="M32 78 L50 88 L68 78" fill="none" stroke="#080C14" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Wordmark -->
  <text x="110" y="52" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="14" font-weight="400" fill="#8FA0BA" letter-spacing="1.5">BETTER CALL</text>
  <text x="110" y="82" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="36" font-weight="800" fill="#EEE9E2" letter-spacing="-1">CRO</text>
  <text x="218" y="82" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="36" font-weight="800" fill="#26C0CB" letter-spacing="-1">SOL</text>
</svg>
